# Supabase local config for fit-crm-connect-main
# Ports offset to avoid conflict with fitgestor-erp-main (which uses 54321-54324)

[api]
enabled = true
port = 54900
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54901
shadow_port = 54902
major_version = 17

[db.pooler]
enabled = false
port = 54903
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54904
api_url = "http://127.0.0.1:54900"

[inbucket]
enabled = true
port = 54905
smtp_port = 54906
pop3_port = 54907

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[edge_runtime]
policy = "per_worker"

[analytics]
enabled = false